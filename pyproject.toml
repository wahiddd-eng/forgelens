[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgelens"
version = "0.1.0"
description = "Explainable detection of forged and AI-edited bank statements."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Syed Wahid Sajad"},
  {name = "Dhruv Bhoye"},
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forgelens.generator" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["third_party"]
